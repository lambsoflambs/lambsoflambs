<!DOCTYPE html>
<html>
    <head>
        <title>
            LYNSWORLD
        </title>
        <link rel="stylesheet" href="kittyStyle.css">
        <script src="meows.js"></script>
        <script src="stim.js"></script>
        <script src="horse.js"></script>
        <script src="carrot_game.js"></script>
        <script src="audio_control.js"></script>
        <style>
            @font-face {
                font-family: 'DSfont';
                src: url('Nintendo-DS-BIOS.ttf') format('woff2');
                font-weight: normal;
                font-style: normal;
            }
        </style>
    </head>
    <body onload="createPiano()">
        <div id="everything_container">
        <div style="background-color:rgb(92, 141, 165);position:relative;width:100%;text-align:center;display:table;"> 
            <a href="/"><img style="height:100px;vertical-align: middle;" src="home1.png" onmouseover="this.src='home2.png';" onmouseout="this.src='home1.png';"></a>
            <a href="about"><img style="height:100px;vertical-align: middle;"src="info_icon1.png" onmouseover="this.src='info_icon2.png';" onmouseout="this.src='info_icon1.png';"></a>
            <a href="gallery"><img style="height:100px;vertical-align: middle;"src="gallery_icon1.png" onmouseover="this.src='gallery_icon2.png';" onmouseout="this.src='gallery_icon1.png';"></a>
            <a href="FMSVL"><img style="height:100px;vertical-align: middle;"src="fmsvl_icon1.png" onmouseover="this.src='fmsvl_icon2.png';" onmouseout="this.src='fmsvl_icon1.png';"></a>
            <a href="FUNZONE"><img style="height:100px;vertical-align: middle;"src="games_icon1.png" onmouseover="this.src='games_icon2.png';" onmouseout="this.src='games_icon1.png';"></a>
        </div>
        

        
        <div style="height:1295px;z-index:1;"> 
            <div id="bg1"> </div>
            <div style="text-align:center;"> <img style="width:1000px;" src="funzone_logo.png"> </div>
        
            <div id="main_container"> 
                <div id="volume_control" style="text-align:center;">
                    <img id="volume_image" width="140px;" onmousedown="volume_change(this)" src="volume_control2.png">
                </div>

                <div class="grid-container">
                    <div id="gameworld2">
                        <canvas id="canvas2"></canvas>
                        <div class="stimages">
                            <img id="carrot_game_bg" src="carrot_game_bg.png">
                            <img id="carrot_counter" src="carrot_counter.png">
                            <img id="carrot_stem1" src="carrot_stem1.png">
                            <img id="carrot_stem2" src="carrot_stem2.png">
                            <img id="carrot_stem3" src="carrot_stem3.png">
                            <img id="carrot_stem4" src="carrot_stem4.png">
                            <img id="carrot_stem5" src="carrot_stem5.png">
                            <img id="carrot_stem6" src="carrot_stem6.png">
                            <img id="carrot_normal" src="carrot_normal.png">
                            <img id="carrot_giga" src="carrot_giga.png">
                            <img id="carrot_happy" src="carrot_happy.png">
                            <img id="carrot_disgusting" src="carrot_disgusting.png">
                            <img id="carrot_horrified" src="carrot_horrified.png">
                            <img id="poof1" src="poof1.png">
                            <img id="poof2" src="poof2.png">
                            <img id="poof3" src="poof3.png">
                            <img id="poof4" src="poof4.png">
                            <img id="poof5" src="poof5.png">
                        </div>
                    </div>

                    <div id="gameworld">
                        <canvas id="canvas1"></canvas>
                        <div class="stimages">
                            <img id="toy" src="stimage1.png">
                            <img id="toy2" src="stimage2.png">
                            <img id="toy3" src="stimage3.png">
                            <img id="toy4" src="stimage4.png">
                            <img id="toy5" src="stimage5.png">
                            <img id="board" src="board.png">
                            <img id="reset1" src="reset1.png">
                            <img id="reset2" src="reset2.png">
                            <img id="reset3" src="reset3.png">
                            <img id="horse" src="horse.gif">
                        </div>
                    </div>
            
                </div>

                <div id="catPiano">
                    <img class="whitecat" width = 80px; onmouseover="meow(this)" onmouseleave="unmeow(this)" src="cat1.png">
                </div>
            </div>
            </div>
            
            <div id="trees">
                <div id="bg3"> </div>
                <div id="bg4"> </div>
                <p style="text-align:center;width:100%;margin-top:140px;position:absolute;font-family:DSfont,Arial,sans-serif;color:white;font-size:25px;"> 
                    this page will be updated with more stuff later....... 
                </p>
            </div>
        
        </div>
    </body>
</html>
